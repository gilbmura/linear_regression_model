[project]
name = "summative"
version = "1.0.0"
description = "JAMB score prediction - linear regression summative (notebook + FastAPI service)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
